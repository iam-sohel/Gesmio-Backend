
spring.application.name=gesmio-backend

# Server Configuration
server.port=8080

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Connection Lifecycle
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000

# Connection Timeout Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application Settings
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.web.pageable.max-page-size=200

# JWT (HS256). JWT_SECRET must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# Allowed Browser Origins (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Timezone used for "today" in attendance
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# First admin account
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
