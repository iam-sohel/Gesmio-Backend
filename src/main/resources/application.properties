spring.application.name=gesmio-backend

# Server Configuration
server.port=8080

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Application settings -------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.web.pageable.max-page-size=200

# JWT (HS256). JWT_SECRET must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# Allowed browser origins (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Timezone used for "today" in attendance
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# First admin account (created at startup only if the email does not exist yet)
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
